spring.application.name=nourishconnect

server.port=${PORT:8080}

# =========================
# MYSQL DATABASE
# =========================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:nourishconnect}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================

nourishconnect.jwt.secret=${JWT_SECRET}
nourishconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# ADMIN
# =========================

nourishconnect.admin.email=${ADMIN_EMAIL}
nourishconnect.admin.password=${ADMIN_PASSWORD}
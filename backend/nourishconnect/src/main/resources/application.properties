spring.application.name=nourishconnect

server.port=${PORT:8080}

# =========================
# MYSQL DATABASE
# =========================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nourishconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:2224}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================

nourishconnect.jwt.secret=${JWT_SECRET:NourishConnectJwtSecretKey2026SecureRandomKey123456}
nourishconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# ADMIN
# =========================

nourishconnect.admin.email=${ADMIN_EMAIL:admin@nourishconnect.org}
nourishconnect.admin.password=${ADMIN_PASSWORD:Admin@12345}